# Pile complète du lakehouse DPE, exécutable sur une machine unique.
#
# Dimensionnement : pensé pour ~16 Go de RAM. Airflow tourne en LocalExecutor
# (pas de Celery ni de Redis) et Spark en un seul worker : sur un poste de
# développement, un cluster multi-worker consomme de la mémoire sans rien
# accélérer, puisque les cœurs sont déjà partagés.

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Accès au lac de données
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Le lac est monté depuis l'hôte : la même donnée que celle utilisée par les
    # cibles `make`, pour que le DAG opère sur l'état réel du projet et non sur
    # une copie divergente.
    DPE_BRONZE_ROOT: /opt/airflow/data/bronze
    # Vue du lac depuis le conteneur Spark, qui le monte sous un autre chemin.
    SPARK_DATA_ROOT: /opt/data
    # Entrepôt analytique
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: dpe
    WAREHOUSE_USER: ${WAREHOUSE_USER:-dpe}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-dpe}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./spark-jobs/target/scala-2.12:/opt/airflow/jars:ro
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
    # Airflow soumet les jobs Spark via `docker exec` : il lui faut donc l'accès
    # au démon Docker de l'hôte. Sans ce montage, les tâches Spark échouent avec
    # « Cannot connect to the Docker daemon ».
    - /var/run/docker.sock:/var/run/docker.sock
  # Le socket Docker appartient au groupe `docker` de l'hôte, dont le GID varie
  # d'une machine à l'autre (133 ici, souvent 999 ailleurs). L'ajouter aux
  # groupes secondaires du conteneur est le seul moyen propre de laisser
  # l'utilisateur `airflow` soumettre des jobs au conteneur Spark.
  #
  # À savoir : monter le socket Docker donne au conteneur un pouvoir équivalent
  # à root sur l'hôte. Acceptable pour une pile de développement local, à
  # proscrire en production — on y passerait par un opérateur Kubernetes ou un
  # cluster Spark dédié.
  group_add:
    - "${DOCKER_GID:-999}"
  # Airflow tourne par défaut en uid 50000, alors que les répertoires montés
  # depuis l'hôte appartiennent à l'utilisateur courant (uid 1000). Sans
  # alignement, ni la tâche d'ingestion ni dbt ne peuvent écrire : le premier
  # échoue sur le lac, le second sur ses journaux.
  # Renseigner AIRFLOW_UID dans .env avec la sortie de `id -u`.
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- #
  # Lac de données : stockage objet compatible S3
  # ---------------------------------------------------------------- #
  minio:
    image: minio/minio:latest
    container_name: dpe_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Ports décalés : 9000/9001 sont souvent déjà pris par une autre
      # instance MinIO sur le poste.
      - "9002:9000"   # API S3
      - "9003:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crée le bucket au démarrage puis s'arrête : un conteneur éphémère évite
  # d'avoir à créer le bucket à la main avant le premier run.
  minio-init:
    image: minio/mc:latest
    container_name: dpe_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/lakehouse &&
      echo 'bucket lakehouse prêt'
      "

  # ---------------------------------------------------------------- #
  # Entrepôt analytique : cible de dbt et source de Power BI
  # ---------------------------------------------------------------- #
  warehouse:
    image: postgres:16-alpine
    container_name: dpe_warehouse
    environment:
      POSTGRES_DB: dpe
      POSTGRES_USER: ${WAREHOUSE_USER:-dpe}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-dpe}
    ports:
      # 5434 côté hôte : 5432 et 5433 sont fréquemment occupés par un
      # PostgreSQL local ou un autre projet.
      - "5434:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./scripts/init-warehouse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-dpe} -d dpe"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- #
  # Spark : exécution du job Scala bronze -> silver
  # ---------------------------------------------------------------- #
  spark:
    build:
      context: ./docker/spark
      args:
        HOST_UID: "${HOST_UID:-1000}"
    container_name: dpe_spark
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-4g}
      # L'uid injecté par `user:` n'a pas d'entrée dans /etc/passwd, donc la JVM
      # ne sait pas résoudre `user.home` et le remplace par « ? ». Ivy tente
      # alors d'écrire dans « ?/.ivy2 » et le job meurt sur
      # « basedir must be absolute ». Un HOME explicite lève l'ambiguïté.
      HOME: /tmp
    volumes:
      - ./spark-jobs/target/scala-2.12:/opt/jars:ro
      - ./data:/opt/data
    # Même contrainte que pour Airflow : l'image officielle tourne sous
    # l'utilisateur `spark` (uid 185), alors que le lac monté depuis l'hôte
    # appartient à l'utilisateur courant. Sur un montage NTFS, dont les droits
    # sont fixés par les options de montage, `chown` est même impossible :
    # aligner l'uid du conteneur est la seule voie.
    user: "${HOST_UID:-1000}:0"
    ports:
      - "4040:4040"   # interface Spark pendant l'exécution d'un job
    depends_on:
      minio:
        condition: service_healthy
    # Conteneur de travail : il attend qu'on lui soumette un job.
    command: ["tail", "-f", "/dev/null"]

  # ---------------------------------------------------------------- #
  # Orchestration
  # ---------------------------------------------------------------- #
  airflow-db:
    image: postgres:16-alpine
    container_name: dpe_airflow_db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: dpe_airflow_init
    # Exception : l'initialisation tourne en root pour donner au volume de
    # journaux, créé par Docker en root, un propriétaire exploitable par les
    # conteneurs qui suivent.
    user: "0:0"
    # Toutes les lignes du bloc `>` doivent rester au même niveau d'indentation :
    # une ligne plus indentée conserverait son retour à la ligne et bash
    # interpréterait la suite comme une commande distincte.
    entrypoint: >
      /bin/bash -c "
      chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs &&
      airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Admin
      --lastname Local --role Admin --email admin@example.com || true)
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: dpe_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: dpe_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  warehouse-data:
  airflow-db-data:
  airflow-logs:
