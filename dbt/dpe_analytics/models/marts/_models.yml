version: 2

models:
  - name: fct_dpe
    description: >
      Table de faits du modèle en étoile. Grain : un diagnostic de performance
      énergétique courant, valide et non remplacé.
    data_tests:
      # Cohérence entre l'étiquette et la consommation au m².
      #
      # Le test est volontairement restreint aux logements d'au moins 40 m² :
      # en dessous, la relation ne tient pas. Les consommations fixes (eau
      # chaude sanitaire, auxiliaires) rapportées à une surface minuscule
      # gonflent mécaniquement le ratio kWh/m², si bien qu'un logement de 8 m²
      # peut afficher une étiquette A avec 140 kWh/m²/an.
      #
      # Mesuré sur les 7,8 M de lignes : 81 logements dans ce cas, tous entre
      # 5 et 15 m². Sans la restriction, le test signalait un défaut de
      # pipeline là où il n'y avait qu'un effet d'échelle.
      - dbt_utils.expression_is_true:
          expression: "not (etiquette_dpe = 'A' and conso_ep_kwh_m2_an > 100)"
          config:
            where: "surface_m2 >= 40"
    columns:
      - name: cle_dpe
        description: Identifiant du diagnostic, clé primaire de la table.
        data_tests:
          # Ce test est en avertissement, pas en erreur, et c'est une decision.
          #
          # L'ADEME publie deux fois le meme diagnostic 2654E1827758R : une version
          # incomplete puis une version complete. Les deux lignes ne different que par
          # `emission_ges_5_usages_par_m2` et `conso_5_usages_par_m2_ef`, nuls dans la
          # premiere. C'est un defaut de la source, pas du pipeline : la deduplication
          # Spark partitionne bien par `numero_dpe` et ne peut pas emettre deux lignes.
          #
          # En erreur, ce test faisait echouer la tache Airflow `dbt_test`, qui bloquait
          # `dbt_docs_generate` : le DAG ne pouvait jamais aboutir. Une alarme qui sonne
          # en permanence finit par ne plus etre regardee.
          #
          # En avertissement, le test continue de rapporter a chaque execution sans
          # bloquer la chaine. Les autres tests gardent leur pouvoir de blocage : une
          # regression reelle casserait toujours le build.
          #
          # Mesure au 30/08/2026 : 1 doublon sur 8 004 187 lignes.
          - unique:
              config:
                severity: warn
          - not_null

      - name: code_commune
        description: Code INSEE de la commune, clé étrangère vers dim_commune.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_commune')
              field: code_commune

      - name: etiquette_dpe
        description: Classe énergie A à G.
        data_tests:
          - not_null
          - accepted_values:
              values: ["A", "B", "C", "D", "E", "F", "G"]

      - name: etiquette_ges
        description: Classe climat A à G.
        data_tests:
          - accepted_values:
              values: ["A", "B", "C", "D", "E", "F", "G"]
              config:
                # Certains DPE anciens n'ont pas d'étiquette GES renseignée :
                # un avertissement suffit, ce n'est pas un défaut de pipeline.
                severity: warn

      - name: surface_m2
        description: Surface habitable en m², strictement positive après filtrage.
        data_tests:
          - not_null
          # Borne haute inclusive, pour coller exactement à la règle appliquée
          # en Scala (`surface > 1000` est rejetée, donc 1000 est conservée).
          # Avec `inclusive: false`, deux logements de très exactement 1000 m²
          # faisaient échouer le test — une incohérence entre deux règles du
          # même projet, pas un défaut de donnée.
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000
              inclusive: true

      - name: conso_ep_kwh_m2_an
        description: Consommation en énergie primaire, kWh/m²/an, 5 usages.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 2000
              inclusive: true

      - name: est_passoire_thermique
        description: Vrai si l'étiquette est F ou G (loi Climat et Résilience).
        data_tests:
          - not_null

  - name: dim_commune
    description: >
      Dimension commune, dérivée des DPE eux-mêmes faute de référentiel fourni
      par la source. Le libellé retenu est le plus fréquent par code INSEE.
    columns:
      - name: code_commune
        data_tests:
          - unique
          - not_null
      - name: nom_commune
        data_tests:
          - not_null
      - name: code_departement
        description: Code département sur 2 ou 3 caractères (Corse et DOM inclus).

  - name: mart_performance_commune
    description: >
      Agrégat par commune et par année, alimentant directement la carte et les
      séries temporelles du rapport Power BI.
    columns:
      - name: code_commune
        data_tests:
          - not_null
      - name: taux_passoires_pct
        description: Part des logements classés F ou G, en pourcentage.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: nb_dpe
        description: Nombre de diagnostics de la commune pour l'année.
        data_tests:
          - not_null

  - name: mart_performance_departement
    description: >
      Agrégat par département, toutes années confondues. Table de référence de
      la carte de France : 104 lignes au lieu des 23 628 communes géolocalisées,
      seule échelle à laquelle une carte nationale reste lisible.
      Les taux y sont pré-calculés car le modèle sémantique Power BI est en
      lecture seule et n'accepte pas de mesure DAX.
    data_tests:
      # Le grain est le cœur du contrat de cette table : une ligne par
      # département. S'il se dédouble, Power BI moyennerait des taux entre eux
      # et la carte deviendrait fausse sans rien signaler.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [code_departement]
      # Cohérence arithmétique : la somme des étiquettes doit retomber sur le
      # total. Un écart signalerait une étiquette hors A-G échappée du silver.
      - dbt_utils.expression_is_true:
          expression: >
            nb_etiquette_a + nb_etiquette_b + nb_etiquette_c + nb_etiquette_d
            + nb_etiquette_e + nb_etiquette_f + nb_etiquette_g = nb_dpe
      # Les passoires sont exactement F et G, par définition réglementaire.
      - dbt_utils.expression_is_true:
          expression: "nb_etiquette_f + nb_etiquette_g = nb_passoires"
      - dbt_utils.expression_is_true:
          expression: "nb_etiquette_a + nb_etiquette_b = nb_logements_performants"
    columns:
      - name: code_departement
        description: >
          Code INSEE du département, clé de la table. Nul pour l'unique ligne
          dont la source ne fournit aucun code exploitable — d'où l'absence de
          test not_null ici, assumée et documentée dans le modèle.
        data_tests:
          - unique
      - name: nom_departement
        description: Libellé issu du seed ref_departement.
        data_tests:
          - not_null
      - name: est_metropole
        description: >
          Faux pour les DOM et les collectivités d'outre-mer. La carte de
          France métropolitaine filtre sur cet indicateur ; sans lui, la
          Nouvelle-Calédonie écraserait l'échelle de la carte.
        data_tests:
          - not_null
      - name: taux_passoires_pct
        description: Part des logements F ou G, rapport de sommes.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: taux_performants_pct
        description: Part des logements A ou B, rapport de sommes.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: nb_dpe
        data_tests:
          - not_null
      - name: nb_communes
        description: Nombre de communes géolocalisées ayant servi au centroïde.

  - name: mart_profil_batiment
    description: >
      Performance croisée par type de logement et période de construction.
      Porte le résultat le plus démonstratif du jeu de données : la chute de la
      part de passoires après la réglementation thermique de 1974.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [type_batiment, tranche_age_batiment]
    columns:
      - name: type_batiment
        data_tests:
          - not_null
          - accepted_values:
              values: ["maison", "appartement"]
      - name: tranche_age_batiment
        data_tests:
          - not_null
      - name: taux_passoires_pct
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: nb_dpe
        data_tests:
          - not_null

seeds:
  - name: ref_departement
    description: >
      Référentiel des départements et collectivités françaises. Versionné dans
      le dépôt plutôt que chargé depuis une source externe : 108 lignes qui ne
      changent qu'au gré des réformes territoriales, autant les figer et les
      relire en revue de code.
    columns:
      - name: code_departement
        data_tests:
          - unique
          - not_null
      - name: nom_departement
        data_tests:
          - not_null
