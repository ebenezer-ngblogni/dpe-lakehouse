name: dpe_analytics
version: "1.0.0"
config-version: 2

profile: dpe_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dpe_analytics:
    # staging : renommage et contrat de nommage, aucune logique métier.
    # Matérialisé en vue : ces modèles ne sont qu'une façade sur les tables
    # chargées par Spark, les matérialiser coûterait du stockage sans rien gagner.
    staging:
      +materialized: view
      +schema: staging
      # Droits déclaratifs : dbt recrée les objets à chaque exécution, donc un
      # GRANT lancé à la main serait perdu au build suivant. Cette clause les
      # réapplique automatiquement.
      +grants:
        select: ["powerbi_reader"]

    # marts : modèle en étoile consommé par Power BI. En table, car Power BI
    # interroge ces objets directement et doit obtenir une réponse rapide.
    marts:
      +materialized: table
      +schema: marts
      +grants:
        select: ["powerbi_reader"]

seeds:
  dpe_analytics:
    +schema: marts
    +grants:
      select: ["powerbi_reader"]
    ref_departement:
      # Types explicites plutôt qu'inférés. Les codes département sont du
      # texte, pas des nombres : « 01 » perdrait son zéro initial et « 2A »
      # ferait échouer la conversion. Le même piège existe côté Power BI, où
      # l'auto-typage des codes INSEE est corrigé à la main.
      +column_types:
        code_departement: varchar(3)
        nom_departement: varchar(64)
        nom_region: varchar(64)
        est_metropole: boolean

vars:
  # Seuil réglementaire : F et G désignent les passoires thermiques au sens de
  # la loi Climat et Résilience.
  etiquettes_passoire: ["F", "G"]
  # Un DPE reste valide 10 ans à compter de son établissement.
  duree_validite_dpe_annees: 10
